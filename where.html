<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>現在地マップ</title>
<!-- 地図ライブラリ Leaflet のCSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  body { margin: 0; font-family: "Hiragino Sans", "Yu Gothic", sans-serif; color: #1d2a2e; background: #f3f6f4; }
  header { padding: 16px 20px 8px; }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  p { margin: 0; color: #4c5d62; font-size: 0.9rem; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 8px 20px 12px; }
  button { font: inherit; padding: 10px 16px; border: 0; border-radius: 6px; background: #1f6f5c; color: #fff; cursor: pointer; }
  button:focus-visible { outline: 3px solid #f0b429; outline-offset: 2px; }
  #info { font-size: 0.9rem; }
  #map { height: 60vh; min-height: 320px; }
</style>
</head>
<body>

<header>
  <h1>現在地マップ</h1>
  <p>ボタンで現在地を表示。地図をクリックすると、その場所を「仮の位置」として表示します。</p>
</header>

<div class="bar">
  <button id="locate">現在地を取得</button>
  <span id="info">まだ位置を取得していません</span>
</div>

<div id="map"></div>

<!-- Leaflet のJS（HTMLの最後で読み込む） -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  // 1. 地図をつくる（最初の中心は東京駅あたり）
  const map = L.map('map').setView([35.681, 139.767], 13);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const info = document.getElementById('info');
  let marker = null; // 今立てているピン

  // 2. ピンを立てる関数（緯度・経度・表示テキスト）
  function showPoint(lat, lng, text) {
    if (marker) marker.remove();            // 前のピンを消す
    marker = L.marker([lat, lng]).addTo(map);
    map.setView([lat, lng], 16);
    info.textContent = text + '：緯度 ' + lat.toFixed(5) + ' / 経度 ' + lng.toFixed(5);
  }

  // 3. 現在地を取得する（ブラウザの Geolocation API）
  document.getElementById('locate').addEventListener('click', () => {
    if (!('geolocation' in navigator)) {
      info.textContent = 'このブラウザは位置情報に対応していません';
      return;
    }
    info.textContent = '取得中…';
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude, longitude, accuracy } = pos.coords;
        showPoint(latitude, longitude, '現在地（誤差およそ ' + Math.round(accuracy) + 'm）');
      },
      (err) => {
        // 許可しなかった・取得できなかったときのメッセージ
        info.textContent = err.code === 1
          ? '位置情報の利用が許可されていません。ブラウザの設定を確認してください'
          : '位置情報を取得できませんでした';
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });

  // 4. 地図をクリックした場所を「仮の位置」として表示（テスト用）
  map.on('click', (e) => {
    showPoint(e.latlng.lat, e.latlng.lng, '仮の位置');
  });
</script>
</body>
</html>
